name: 🐛 Bug Report
description: Report an issue, bug, or unexpected behavior in SCLogMate.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the fields below as accurately as possible.
  - type: input
    id: version
    attributes:
      label: SCLogMate Version
      description: Which version are you running? (e.g. v1.0.0-beta1)
      placeholder: v1.0.0-beta1
    validations:
      required: true
  - type: input
    id: sc_version
    attributes:
      label: Star Citizen Version / Channel
      description: Which Star Citizen game channel are you playing? (e.g. LIVE 4.0, EPTU 4.0.1, PTU)
      placeholder: LIVE 4.0.0-LIVE.1234567
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 📝 Description of the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened versus what you expected...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Launch SCLogMate
        2. Spawn ship in Star Citizen
        3. Observe that...
    validations:
      required: true
  - type: textarea
    id: log_snippet
    attributes:
      label: 📜 Relevant Game.log Snippet (if applicable)
      description: Relevant lines from your `%StarCitizen%\LIVE\Game.log` (please strip any private player tokens or sensitive IDs).
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am running the latest release of SCLogMate.
          required: false
