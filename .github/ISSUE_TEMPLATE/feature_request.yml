name: 💡 Feature Request
description: Suggest a new feature, heuristic, or improvement for SCLogMate.
title: "[FEATURE]: "
labels: ["enhancement", "idea"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a suggestion to improve SCLogMate!
  - type: textarea
    id: problem
    attributes:
      label: 🎯 Problem or Motivation
      description: Is your feature request related to a problem or a specific Star Citizen gameplay workflow?
      placeholder: A clear and concise description of what the problem or need is...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed Solution / Feature Scope
      description: Describe the solution you'd like (e.g. new tab, overlay widget, toast notification, parser heuristic).
      placeholder: It would be great if SCLogMate could...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternative Approaches
      description: Any alternative solutions or features you've considered?
      placeholder: An alternative approach could be...
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have verified this is not already covered in ROADMAP.md or existing issues.
          required: true
