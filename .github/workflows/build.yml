name: CI Build & Test

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          9.0.x
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore SCLogMate.csproj

    - name: Build Project (Release)
      run: dotnet build SCLogMate.csproj -c Release --no-restore

    - name: Publish Single-File Executable
      run: |
        dotnet publish SCLogMate.csproj -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false `
          -o ./publish

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: SCLogMate-win-x64
        path: ./publish/SCLogMate.exe
        if-no-files-found: error
