name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0-beta3)'
        required: true
        default: 'v1.0.0-beta3'
      is_prerelease:
        description: 'Mark this release as a Pre-Release'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          9.0.x
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore SCLogMate.csproj

    - name: Publish Single-File Executable
      run: |
        dotnet publish SCLogMate.csproj -c Release -r win-x64 --self-contained true `
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false `
          -o ./publish

    - name: Prepare Release Assets & Checksums
      shell: pwsh
      run: |
        $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.tag_name }}" }
        $exe = "./publish/SCLogMate.exe"
        
        # Create Zip bundle
        Compress-Archive -Path $exe -DestinationPath "./publish/SCLogMate-$tag-win-x64.zip" -Force

        # Generate SHA256 Checksums
        $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash
        $zipHash = (Get-FileHash "./publish/SCLogMate-$tag-win-x64.zip" -Algorithm SHA256).Hash

        $checksums = @"
        $exeHash  SCLogMate.exe
        $zipHash  SCLogMate-$tag-win-x64.zip
        "@

        Set-Content -Path "./publish/SHA256SUMS.txt" -Value $checksums -Encoding UTF8
        "EXE_HASH=$exeHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: VirusTotal Analysis
      uses: crazy-max/ghaction-virustotal@v5
      if: ${{ env.VT_API_KEY != '' }}
      env:
        VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      with:
        vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
        files: |
          ./publish/SCLogMate.exe
      continue-on-error: true

    - name: Extract Release Notes from CHANGELOG
      id: extract_notes
      shell: pwsh
      run: |
        $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.tag_name }}" }
        $ver = $tag.TrimStart('v')
        $cl = Get-Content CHANGELOG.md -Raw
        $verPat = "(?ms)^## \[$([regex]::Escape($ver))\][^\r\n]*\r?\n(.*?)(?=^## \[|^# Archive:|\z)"
        if ($cl -match $verPat) {
            $notes = $Matches[1].Trim()
        } else {
            $notes = "Release $tag of SCLogMate."
        }
        
        $exeHash = $env:EXE_HASH
        $notes += "`r`n`r`n---`r`n### 🛡️ Security & Integrity`r`n"
        $notes += '- **SHA-256 (SCLogMate.exe):** `' + $exeHash + '`'
        if ($exeHash) {
            $notes += "`r`n- **VirusTotal Report:** [Scan Results](https://www.virustotal.com/gui/file/" + $exeHash + ")"
        }
        $notes += "`r`n`r`n---`r`n📋 **Full Changelog:** https://github.com/gOOvER/SCLogMate/blob/main/CHANGELOG.md"
        Set-Content -Path "./publish/RELEASE_NOTES.md" -Value $notes -Encoding UTF8

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name || github.event.inputs.tag_name }}
        tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
        body_path: ./publish/RELEASE_NOTES.md
        draft: false
        prerelease: ${{ inputs.is_prerelease == true || github.event.inputs.is_prerelease == 'true' || contains(github.ref_name || github.event.inputs.tag_name, '-beta') || contains(github.ref_name || github.event.inputs.tag_name, '-rc') || contains(github.ref_name || github.event.inputs.tag_name, '-alpha') }}
        files: |
          ./publish/SCLogMate.exe
          ./publish/SCLogMate-*.zip
          ./publish/SHA256SUMS.txt
          